[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unicodes"
version = "0.1.0"
description = "Reusable Python ports of my university MATLAB codes"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joshua Poznanski" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
mat73 = ["h5py>=3.8"]
symbolic = ["sympy>=1.12"]
dev = ["pytest>=7", "sympy>=1.12", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
